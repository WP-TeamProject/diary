{% extends "base.html" %} {% block title %}그룹 이름 변경 — Moodiary{% endblock %}

{% block extra_head %}
{% endblock %}

{% block content %}
<div class="container my-5">
  
  <div class="row justify-content-center align-items-center" style="min-height: 70vh;">
    
    <div class="col-12 col-md-8 col-lg-5">
      
      <div class="card bg-surface border border-secondary shadow-4-strong" style="background-color: #14171f;">
        <div class="card-body p-5">
          
          <div class="text-center mb-4">
            <h1 class="fw-bold text-white mb-2" style="font-family: 'DM Serif Display', serif; font-size: 1.8rem;">
              그룹 이름 변경
            </h1>
            <p class="text-muted">
              현재 이름: <strong style="color: var(--accent2);">{{ room.room_name }}</strong>
            </p>
          </div>

          <form method="POST" action="{{ url_for('room.edit_room_name', room_id=room._id) }}">
            
            <div class="form-outline mb-4" data-mdb-input-init>
              <input type="text" id="room_name" name="room_name" class="form-control form-control-lg text-white" value="{{ room.room_name }}" required />
              <label class="form-label text-muted" for="room_name">새로운 그룹 이름</label>
            </div>
            
            <div class="row g-2 mt-4">
              
              <div class="col-6">
                <a href="{{ url_for('room.detail', room_id=room._id) }}" class="btn-ghost btn-lg btn-block text-center btn-rounded text-white" style="text-decoration: none;">
                  취소
                </a>
              </div>
              
              <div class="col-6">
                <button type="submit" class="btn-accent btn-lg btn-block btn-rounded shadow-2-strong">
                  변경하기
                </button>
              </div>
              
            </div> </form> </div> </div> </div> </div> </div> {% endblock %}
