{% extends "base.html" %}
{% block title %}비밀번호 변경 — Moodiary{% endblock %}

{% block extra_head %}
<style>
  .settings-wrap {
    min-height: calc(100vh - 120px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem 1rem;
  }
  .settings-card {
    width: 100%;
    max-width: 440px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 2.5rem 2rem;
  }
  .settings-title {
    font-family: 'DM Serif Display', serif;
    font-size: 1.5rem;
    margin-bottom: .35rem;
  }
  .settings-sub { color: var(--muted); font-size: .875rem; margin-bottom: 2rem; }
  .form-group { margin-bottom: 1.25rem; }
  .hint { color: var(--muted); font-size: .75rem; margin-top: .4rem; }
  .btn-row { display: flex; gap: .75rem; margin-top: 1.5rem; }
  .btn-full { flex: 1; text-align: center; }
</style>
{% endblock %}

{% block content %}
<div class="settings-wrap">
  <div class="settings-card">
    <div class="settings-title">비밀번호 변경</div>
    <div class="settings-sub">보안을 위해 주기적으로 변경해 주세요.</div>

    <form method="POST" action="{{ url_for('user.change_password') }}">
      <div class="form-group">
        <label class="md-label" for="old_password">현재 비밀번호</label>
        <input class="md-input" type="password" id="old_password" name="old_password"
               placeholder="현재 비밀번호" required autocomplete="current-password" />
      </div>
      <div class="form-group">
        <label class="md-label" for="new_password">새 비밀번호</label>
        <input class="md-input" type="password" id="new_password" name="new_password"
               placeholder="새 비밀번호 (8자 이상)" required autocomplete="new-password" />
        <p class="hint">최소 8자 이상</p>
      </div>
      <div class="btn-row">
        <a href="{{ url_for('main.home') }}" class="btn-ghost btn-full">취소</a>
        <button type="submit" class="btn-accent btn-full">변경하기</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
