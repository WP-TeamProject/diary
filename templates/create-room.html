{% extends "base.html" %} {% block title %}그룹 만들기 — Moodiary{% endblock %}

{% block extra_head %}
<style>
  .tip {
    background: rgba(124,106,247,.1);
    border: 1px solid rgba(124,106,247,.25);
    border-radius: 10px;
    padding: .85rem 1.1rem;
    color: var(--accent2);
    font-size: .85rem;
    margin-bottom: 1.5rem;
  }


</style>
{% endblock %}

{% block content %}
<div class="container my-5">
  
  <div class="row justify-content-center align-items-center" style="min-height: 70vh;">
    
    <div class="col-12 col-md-8 col-lg-5">
      
      <div class="card bg-surface border border-secondary shadow-4-strong" style="background-color: #14171f;">
        <div class="card-body p-5">
          
          <div class="text-center mb-4">
            <h1 class="fw-bold text-white mb-2" style="font-family: 'DM Serif Display', serif; font-size: 1.8rem;">
              새 그룹 만들기
            </h1>
            <p class="text-muted">폐쇄형 그룹을 생성하고 친구를 초대하세요</p>
          </div>

          <div class="tip shadow-sm">
            <i class="fas fa-lightbulb me-2 text-warning"></i>그룹을 만들면 자동으로 <strong>방장</strong>이 됩니다. 멤버는 초대로만 참여할 수 있어요.
          </div>

          <form method="POST" action="{{ url_for('room.create') }}">
            
            <div class="form-outline mb-4" data-mdb-input-init>
              <input type="text" id="room_name" name="room_name" class="form-control form-control-lg text-white" required />
              <label class="form-label text-muted" for="room_name">사용할 그룹 이름</label>
            </div>
            
            <div class="row g-2 mt-4">
              
              <div class="col-6">
                <a href="{{ url_for('room.room_list') }}" class="btn-ghost btn-lg btn-block text-center btn-rounded text-white" style="text-decoration: none;">
                  취소
                </a>
              </div>
              
              <div class="col-6">
                <button type="submit" class="btn-accent btn-lg btn-block btn-rounded shadow-2-strong">
                  만들기
                </button>
              </div>
              
            </div> </form> </div> </div> </div> </div> </div> {% endblock %}
