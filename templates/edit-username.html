{% extends "base.html" %} {% block title %}아이디 변경 — Moodiary{% endblock %}

{% block extra_head %}
{% endblock %}

{% block content %}
<div class="container my-5">
  
  <div class="row justify-content-center align-items-center" style="min-height: 70vh;">
    
    <div class="col-12 col-md-8 col-lg-5">
      
      <div class="card bg-surface border border-secondary shadow-4-strong" style="background-color: #14171f;">
        <div class="card-body p-5">
          
          <div class="text-center mb-4">
            <h1 class="fw-bold text-white mb-2" style="font-family: 'DM Serif Display', serif; font-size: 1.8rem;">
              아이디 변경
            </h1>
            <p class="text-muted">
              현재 아이디: <strong style="color: var(--accent2);">{{ session.get('username') }}</strong>
            </p>
          </div>

          <form method="POST" action="{{ url_for('user.change_username') }}">
            
            <div class="form-outline mb-4" data-mdb-input-init>
              <input type="text" id="username" name="username" class="form-control form-control-lg text-white" required autocomplete="username" />
              <label class="form-label text-muted" for="username">새로운 아이디를 입력하세요</label>
            </div>
            
            <div class="row g-2 mt-4">
              
              <div class="col-6">
                <a href="{{ url_for('main.home') }}" class="btn-ghost btn-lg btn-block text-center btn-rounded text-white" style="text-decoration: none;">
                  취소
                </a>
              </div>
              
              <div class="col-6">
                <button type="submit" class="btn-accent btn-lg btn-block btn-rounded shadow-2-strong">
                  변경하기
                </button>
              </div>
              
            </div> </form> </div> </div> </div> </div> </div> {% endblock %}
