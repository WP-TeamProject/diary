{% extends "base.html" %}
{% block title %}아이디 변경 — Moodiary{% endblock %}

{% block extra_head %}
<style>
  .settings-wrap {
    min-height: calc(100vh - 120px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem 1rem;
  }
  .settings-card {
    width: 100%;
    max-width: 440px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 2.5rem 2rem;
  }
  .settings-title {
    font-family: 'DM Serif Display', serif;
    font-size: 1.5rem;
    margin-bottom: .35rem;
  }
  .settings-sub { color: var(--muted); font-size: .875rem; margin-bottom: 2rem; }
  .form-group { margin-bottom: 1.25rem; }
  .btn-row { display: flex; gap: .75rem; margin-top: 1.5rem; }
  .btn-full { flex: 1; text-align: center; }
</style>
{% endblock %}

{% block content %}
<div class="settings-wrap">
  <div class="settings-card">
    <div class="settings-title">아이디 변경</div>
    <div class="settings-sub">현재: <strong style="color:var(--accent2)">{{ session.get('username') }}</strong></div>

    <form method="POST" action="{{ url_for('user.change_username') }}">
      <div class="form-group">
        <label class="md-label" for="username">새 아이디</label>
        <input class="md-input" type="text" id="username" name="username"
               placeholder="새로운 아이디를 입력하세요" required autocomplete="username" />
      </div>
      <div class="btn-row">
        <a href="{{ url_for('main.home') }}" class="btn-ghost btn-full">취소</a>
        <button type="submit" class="btn-accent btn-full">변경하기</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
