{% extends "base.html" %} {% block title %}비밀번호 변경 — Moodiary{% endblock %}

{% block extra_head %}
<style>
  .settings-title {
    font-family: 'DM Serif Display', serif;
    font-size: 1.8rem;
    margin-bottom: .35rem;
  }
  
  .hint { 
    color: var(--muted); 
    font-size: .75rem; 
    margin-top: .4rem; 
    margin-bottom: 1rem;
    padding-left: .5rem;
  }


</style>
{% endblock %}

{% block content %}
<div class="container my-5">
  
  <div class="row justify-content-center align-items-center" style="min-height: 70vh;">
    
    <div class="col-12 col-md-8 col-lg-5">
      
      <div class="card bg-surface border border-secondary shadow-4-strong" style="background-color: #14171f;">
        <div class="card-body p-5">
          
          <div class="text-center mb-4">
            <h1 class="fw-bold text-white mb-2 settings-title">
              비밀번호 변경
            </h1>
            <p class="text-muted">
              보안을 위해 주기적으로 변경해 주세요.
            </p>
          </div>

          <form method="POST" action="{{ url_for('user.change_password') }}">
            
            <div class="form-outline mb-4" data-mdb-input-init>
              <input type="password" id="old_password" name="old_password" class="form-control form-control-lg text-white" required autocomplete="current-password" />
              <label class="form-label text-muted" for="old_password">현재 비밀번호</label>
            </div>
            
            <div class="form-outline" data-mdb-input-init>
              <input type="password" id="new_password" name="new_password" class="form-control form-control-lg text-white" required autocomplete="new-password" minlength="8" />
              <label class="form-label text-muted" for="new_password">새 비밀번호</label>
            </div>
            <p class="hint"><i class="fas fa-lock me-1"></i>최소 8자 이상</p>
            
            <div class="row g-2 mt-4">
              
              <div class="col-6">
                <a href="{{ url_for('main.home') }}" class="btn-ghost btn-lg btn-block text-center btn-rounded text-white" style="text-decoration: none;">
                  취소
                </a>
              </div>
              
              <div class="col-6">
                <button type="submit" class="btn-accent btn-lg btn-block btn-rounded shadow-2-strong">
                  변경하기
                </button>
              </div>
              
            </div> </form> </div> </div> </div> </div> </div> {% endblock %}
