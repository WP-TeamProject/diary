{% extends "base.html" %}
{% block title %}회원가입 — Moodiary{% endblock %}

{% block extra_head %}
<style>
  .auth-wrap {
    min-height: calc(100vh - 120px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem 1rem;
  }
  .auth-card {
    width: 100%;
    max-width: 440px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 2.5rem 2rem;
  }
  .auth-logo {
    font-family: 'DM Serif Display', serif;
    font-size: 1.6rem;
    color: var(--accent2);
    text-align: center;
    margin-bottom: .4rem;
  }
  .auth-logo span { color: var(--accent); }
  .auth-tagline {
    text-align: center;
    color: var(--muted);
    font-size: .85rem;
    margin-bottom: 2rem;
  }
  .form-group { margin-bottom: 1.25rem; }
  .hint { color: var(--muted); font-size: .75rem; margin-top: .4rem; }
  .auth-footer {
    text-align: center;
    margin-top: 1.5rem;
    color: var(--muted);
    font-size: .85rem;
  }
  .auth-footer a { color: var(--accent2); text-decoration: none; }
  .auth-footer a:hover { text-decoration: underline; }
  .btn-full { width: 100%; text-align: center; }
</style>
{% endblock %}

{% block content %}
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-logo">mood<span>·</span>iary</div>
    <div class="auth-tagline">감정을 기록하는 여정을 시작해요 ✨</div>

    <form method="POST" action="{{ url_for('user.register') }}">
      <div class="form-group">
        <label class="md-label" for="username">아이디</label>
        <input class="md-input" type="text" id="username" name="username"
               placeholder="4자 이상의 아이디" required autocomplete="username" />
        <p class="hint">최소 4자 이상</p>
      </div>
      <div class="form-group">
        <label class="md-label" for="email">이메일</label>
        <input class="md-input" type="email" id="email" name="email"
               placeholder="example@email.com" required autocomplete="email" />
      </div>
      <div class="form-group">
        <label class="md-label" for="password">비밀번호</label>
        <input class="md-input" type="password" id="password" name="password"
               placeholder="8자 이상의 비밀번호" required autocomplete="new-password" />
        <p class="hint">최소 8자 이상</p>
      </div>
      <button type="submit" class="btn-accent btn-full" style="margin-top:.5rem;">가입하기</button>
    </form>

    <hr class="md-divider" />
    <div class="auth-footer">
      이미 계정이 있으신가요?
      <a href="{{ url_for('user.login') }}">로그인</a>
    </div>
  </div>
</div>
{% endblock %}
