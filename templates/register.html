{% extends "base.html" %}
{% block title %}회원가입 — Moodiary{% endblock %}

{% block extra_head %}
<style>
  .auth-logo {
    font-family: 'DM Serif Display', serif;
    font-size: 1.6rem;
    color: var(--accent2);
    text-align: center;
    margin-bottom: .4rem;
  }
  .auth-logo span { color: var(--accent); }
  
  .auth-tagline {
    text-align: center;
    color: var(--muted);
    font-size: .85rem;
    margin-bottom: 2rem;
  }

  .hint { 
    color: var(--muted); 
    font-size: .75rem; 
    margin-top: .4rem; 
    margin-bottom: 1rem;
    padding-left: .5rem;
  }

  .auth-footer {
    text-align: center;
    margin-top: 1.5rem;
    color: var(--muted);
    font-size: .85rem;
  }
  .auth-footer a { color: var(--accent2); text-decoration: none; font-weight: bold; }
  .auth-footer a:hover { text-decoration: underline; }
</style>
{% endblock %}

{% block content %}
<div class="container my-5">
  <div class="row justify-content-center align-items-center" style="min-height: 70vh;">
    
    <div class="col-12 col-md-8 col-lg-5">
      
      <div class="card bg-surface border border-secondary shadow-4-strong" style="background-color: #14171f;">
        <div class="card-body p-5">
          
          <div class="auth-logo">mood<span>·</span>iary</div>
          <div class="auth-tagline">감정을 기록하는 여정을 시작해요 ✨</div>

          <form method="POST" action="{{ url_for('user.register') }}">
            
            <div class="form-outline" data-mdb-input-init>
              <input type="text" id="username" name="username" class="form-control form-control-lg text-white" required autocomplete="username" minlength="4" />
              <label class="form-label text-muted" for="username">아이디를 입력하세요</label>
            </div>
            <p class="hint"><i class="fas fa-info-circle me-1"></i>최소 4자 이상</p>

            <div class="form-outline mb-4" data-mdb-input-init>
              <input type="email" id="email" name="email" class="form-control form-control-lg text-white" required autocomplete="email" />
              <label class="form-label text-muted" for="email">이메일 (example@email.com)</label>
            </div>

            <div class="form-outline" data-mdb-input-init>
              <input type="password" id="password" name="password" class="form-control form-control-lg text-white" required autocomplete="new-password" minlength="8" />
              <label class="form-label text-muted" for="password">비밀번호를 입력하세요</label>
            </div>
            <p class="hint"><i class="fas fa-lock me-1"></i>최소 8자 이상</p>

            <button type="submit" class="btn btn-primary btn-lg btn-block btn-rounded mt-3 shadow-2-strong">
              가입하기
            </button>
          </form>

          <hr class="border-secondary my-4" />
          
          <div class="auth-footer">
            이미 계정이 있으신가요?
            <a href="{{ url_for('user.login') }}">로그인</a>
          </div>

        </div>
      </div>

    </div>
  </div>
</div>
{% endblock %}
