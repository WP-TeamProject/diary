{% extends "base.html" %}
{% block title %}글 쓰기 — Moodiary{% endblock %}

{% block extra_head %}
<style>
  .write-wrap { max-width: 720px; margin: 0 auto; }
  .ai-notice {
    background: rgba(124,106,247,.1);
    border: 1px solid rgba(124,106,247,.25);
    border-radius: 12px;
    padding: 1rem 1.25rem;
    display: flex;
    align-items: center;
    gap: .75rem;
    margin-bottom: 1.75rem;
    font-size: .875rem;
    color: var(--accent2);
  }
  .ai-notice .icon { font-size: 1.4rem; flex-shrink: 0; }
  .form-group { margin-bottom: 1.25rem; }
  .char-count {
    text-align: right;
    color: var(--muted);
    font-size: .75rem;
    margin-top: .35rem;
  }
  .btn-row { display: flex; gap: .75rem; justify-content: flex-end; margin-top: 1.75rem; }
</style>
{% endblock %}

{% block content %}
<div class="page-wrap">
  <div style="margin-bottom:1.25rem">
    <a href="{{ url_for('post.post_list', room_id=room_id) }}" class="btn-ghost" style="font-size:.85rem;padding:.4rem .9rem;">← 목록으로</a>
  </div>

  <div class="write-wrap">
    <h1 class="page-title">새 글 쓰기</h1>
    <p class="page-sub">오늘의 감정을 솔직하게 적어보세요</p>

    <div class="ai-notice">
      <span class="icon">🤖</span>
      <span>글을 저장하면 AI가 감정을 자동으로 분석합니다. 솔직하게 쓸수록 더 정확해요.</span>
    </div>

    <div class="md-card">
      <form method="POST" action="{{ url_for('post.write', room_id=room_id) }}">
        <div class="form-group">
          <label class="md-label" for="title">제목</label>
          <input class="md-input" type="text" id="title" name="title"
                 placeholder="오늘의 제목을 입력하세요" required />
        </div>
        <div class="form-group">
          <label class="md-label" for="content">내용</label>
          <textarea class="md-input md-textarea" id="content" name="content"
                    placeholder="오늘 있었던 일이나 감정을 자유롭게 써보세요..."
                    required oninput="updateCount(this)"></textarea>
          <div class="char-count" id="charCount">0자</div>
        </div>
        <div class="btn-row">
          <a href="{{ url_for('post.post_list', room_id=room_id) }}" class="btn-ghost">취소</a>
          <button type="submit" class="btn-accent">감정 분석 후 저장</button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
  function updateCount(el) {
    document.getElementById('charCount').textContent = el.value.length + '자';
  }
</script>
{% endblock %}
