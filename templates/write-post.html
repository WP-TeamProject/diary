{% extends "base.html" %}
{% block title %}글 쓰기 — Moodiary{% endblock %}

{% block extra_head %}
<style>
  .ai-notice {
    background: rgba(124,106,247,.1);
    border: 1px solid rgba(124,106,247,.25);
    border-radius: 12px;
    padding: 1rem 1.25rem;
    display: flex;
    align-items: center;
    gap: .75rem;
    margin-bottom: 1.75rem;
    font-size: .875rem;
    color: var(--accent2);
  }
  .ai-notice .icon { font-size: 1.4rem; flex-shrink: 0; }
  
  .char-count {
    text-align: right;
    color: var(--muted);
    font-size: .75rem;
    margin-top: .35rem;
  }
  
</style>
{% endblock %}

{% block content %}
<div class="container my-5">
  
  <div class="row justify-content-center">
    
    <div class="col-12 col-md-10 col-lg-8">
      
      <div style="margin-bottom: 1.25rem;">
        <a href="{{ url_for('post.post_list', room_id=room_id) }}" class="btn-ghost" style="font-size: .85rem; padding: .4rem .9rem;">
          ← 그룹 피드로 돌아가기
        </a>
      </div>

      <h1 class="page-title">새 글 쓰기</h1>
      <p class="page-sub">오늘의 감정을 솔직하게 적어보세요</p>

      <div class="ai-notice shadow-sm">
        <span class="icon">🤖</span>
        <span>글을 저장하면 AI가 감정을 자동으로 분석합니다. 솔직하게 쓸수록 더 정확해요.</span>
      </div>

      <div class="md-card shadow-4-strong">
        
        <form method="POST" action="{{ url_for('post.write', room_id=room_id) }}">
          
          <div class="form-outline mb-4" data-mdb-input-init>
            <input type="text" id="title" name="title" class="form-control form-control-lg text-white" required />
            <label class="form-label text-muted" for="title">오늘의 제목을 입력하세요</label>
          </div>

          <div class="form-outline mb-1" data-mdb-input-init>
            <textarea class="form-control text-white" id="content" name="content" rows="8" required oninput="updateCount(this)"></textarea>
            <label class="form-label text-muted" for="content">오늘 있었던 일이나 복잡한 감정을 자유롭게 쏟아내 보세요...</label>
          </div>
          
          <div class="char-count mb-4" id="charCount">0자</div>

          <div class="d-flex justify-content-end gap-3 mt-2">
            <a href="{{ url_for('post.post_list', room_id=room_id) }}" class="btn-ghost">취소</a>
            <button type="submit" class="btn-accent shadow-2-strong">
              <i class="fas fa-magic me-2"></i>감정 분석 후 저장
            </button>
          </div>

        </form>

      </div>

    </div>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
  function updateCount(el) {
    document.getElementById('charCount').textContent = el.value.length + '자';
  }
</script>
{% endblock %}
