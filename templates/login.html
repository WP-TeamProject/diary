{% extends "base.html" %}
{% block title %}로그인 — Moodiary{% endblock %}

{% block extra_head %}
<style>
  .auth-logo {
    font-family: 'DM Serif Display', serif;
    font-size: 1.8rem;
    color: var(--accent2);
    text-align: center;
    margin-bottom: .4rem;
  }
  .auth-logo span { color: var(--accent); }
</style>
{% endblock %}

{% block content %}
<div class="container my-5">
  <div class="row justify-content-center align-items-center" style="min-height: 70vh;">
    
    <div class="col-12 col-md-8 col-lg-5">
      
      <div class="card bg-surface border border-secondary shadow-4-strong" style="background-color: #14171f;">
        <div class="card-body p-5">
          
          <div class="auth-logo">mood<span>·</span>iary</div>
          <p class="text-center text-muted mb-4">다시 만나서 반가워요 👋</p>

          <form method="POST" action="{{ url_for('user.login') }}">
            
            <div class="form-outline mb-4" data-mdb-input-init>
              <input type="text" id="username" name="username" class="form-control form-control-lg text-white" required autocomplete="username" />
              <label class="form-label text-muted" for="username">아이디를 입력하세요</label>
            </div>

            <div class="form-outline mb-4" data-mdb-input-init>
              <input type="password" id="password" name="password" class="form-control form-control-lg text-white" required autocomplete="current-password" />
              <label class="form-label text-muted" for="password">비밀번호를 입력하세요</label>
            </div>

            <button type="submit" class="btn btn-primary btn-lg btn-block btn-rounded mt-4 shadow-2-strong">
              로그인
            </button>
          </form>

          <hr class="border-secondary my-4" />
          
          <div class="text-center">
            <p class="mb-0 text-muted">
              아직 계정이 없으신가요? 
              <a href="{{ url_for('user.register') }}" class="fw-bold" style="color: #b89eff; text-decoration: none;">회원가입</a>
            </p>
          </div>

        </div>
      </div>

    </div>
  </div>
</div>
{% endblock %}
